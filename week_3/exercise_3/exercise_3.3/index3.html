<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Quality Audit Form</title>
</head>
<body>

    <h1>Internal Quality Audit Form</h1>

    <form method="post" action="#" enctype="multipart/form-data">

        <fieldset>
            <legend>General Audit Information</legend>

            <p>
                <label for="auditorName">Auditor Name:</label><br>
                <input type="text" id="auditorName" name="auditorName"
                required placeholder="Full Name of Auditor">
            </p>

            <p>
                <label for="auditDate">Audit Date:</label><br>
                <input type="date" id="auditDate" name="auditDate"
                required>
            </p>

            <p>
                <label for="department">Department Audited:</label><br>
                <select id="department" name="department" required>
                    <option value="">-- Select Department --</option>
                    <option value="Finance">Finance</option>
                    <option value="Production">Production</option>
                    <option value="Marketing">Marketing</option>
                    <option value="HR">Human Resources</option>
                </select>
            </p>

            <p>
                Audit Type:<br>
                <input type="radio" id="internal" name="auditType"
                value="Internal" required>
                <label for="internal">Internal</label>

                <input type="radio" id="external" name="auditType"
                value="External">
                <label for="external">External</label>
            </p>

        </fieldset>

        <fieldset>
            <legend>Audit Assessment Areas</legend>

            <fieldset>
                <legend>Documentation Compliance</legend>

                <p>
                    Documents complete and up-to-date?<br>

                    <input type="radio" id="docYes"
                    name="docCompliance" value="Yes" required>
                    <label for="docYes">Yes</label>

                    <input type="radio" id="docNo"
                    name="docCompliance" value="No">
                    <label for="docNo">No</label>
                </p>

                <p>
                    <label for="docNotes">Additional Notes:</label><br>
                    <textarea id="docNotes" name="docNotes" rows="3"
                    cols="50"
                    placeholder="Describe your observations..."></textarea>
                </p>

            </fieldset>

            <fieldset>
                <legend>Procedure Compliance</legend>

                <p>
                    Procedures followed correctly?<br>

                    <input type="radio" id="procYes"
                    name="procCompliance" value="Yes" required>
                    <label for="procYes">Yes</label>

                    <input type="radio" id="procNo"
                    name="procCompliance" value="No">
                    <label for="procNo">No</label>
                </p>

                <p>
                    <label for="complianceValue">
                    Compliance Score (1-5):</label><br>

                    <input type="number" id="complianceValue"
                    name="complianceValue" min="1" max="5" required>
                </p>

            </fieldset>
