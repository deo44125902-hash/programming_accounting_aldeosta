<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Transaction Form</title>

    <style>
        body {
            font-family: Verdana, sans-serif;
            background-color: #86b4eb;
            margin: 0;
            padding: 20px;
            background-image: url('https://placehold.co/1920x1080/E0F7FA/000?text=Accounting');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        form {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }

        fieldset {
            border: 1px solid #090299;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #ffffff;
        }

        legend {
            font-weight: bold;
            color: #34495e;
            padding: 0 10px;
            background-color: #ffffff;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        input[type="radio"],
        input[type="checkbox"] 
        {
            margin-right: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            margin-right: 10px;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: #0056b3;
        }

        input[type="reset"] {
            background-color: #6c757d;
        }

        input[type="reset"]:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>

    <form>

        <h1>Financial Transaction Form</h1>

        <fieldset>

            <legend>Transaction Information</legend>

            <label for="name">Name</label>
            <input type="text" id="name">

            <label for="amount">Amount</label>
            <input type="number" id="amount">

            <label for="date">Transaction Date</label>
            <input type="date" id="date">

            <label for="type">Transaction Type</label>

            <select id="type">
                <option>Income</option>
                <option>Expense</option>
                <option>Asset</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description"></textarea>

        </fieldset>

        <fieldset>

            <legend>Additional Information</legend>

            <label>
                <input type="radio" name="status" value="paid">
                Paid
            </label>

            <label>
                <input type="radio" name="status" value="unpaid">
                Unpaid
            </label>

            <label>
                <input type="checkbox">
                I confirm the transaction information
            </label>

        </fieldset>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
