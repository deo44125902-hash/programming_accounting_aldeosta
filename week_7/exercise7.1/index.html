<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive General Journal Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Interactive General Journal Form</h1>
    <p>ALDEEE Tax Consulting</p>

    <form id="journalForm">

        <fieldset>
            <legend>Journal Transaction Details</legend>

            <label for="date">Date:</label><br>
            <input type="date" id="date" name="date">
            <br><br>

            <label for="refNo">Ref. No.:</label><br>
            <input type="text" id="refNo" name="refNo">
            <br><br>

            <label for="description">Description:</label><br>
            <input type="text" id="description" name="description">
            <br><br>

            <label for="account">Account:</label><br>
            <select id="account" name="account">
                <option value="">-- Select Account --</option>
                <option value="Cash">Cash</option>
                <option value="Bank">Bank</option>
                <option value="Accounts Receivable">Accounts Receivable</option>
                <option value="Service Revenue">Service Revenue</option>
                <option value="Salaries Expense">Salaries Expense</option>
                <option value="Accounts Payable">Accounts Payable</option>
                <option value="Share Capital">Share Capital</option>
            </select>
            <br><br>

            <label for="debit">Debit:</label><br>
            <input type="number" id="debit" name="debit" min="0" step="0.01">
            <br><br>

            <label for="credit">Credit:</label><br>
            <input type="number" id="credit" name="credit" min="0" step="0.01">
            <br><br>

            <button type="button" id="addRowBtn">Add Transaction Row</button>
            <button type="button" id="saveJournalBtn">Save Journal (Dummy)</button>
        </fieldset>

    </form>

    <h2>General Journal Transactions</h2>

    <table id="transactionTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Ref. No.</th>
                <th>Description</th>
                <th>Account</th>
                <th>Debit</th>
                <th>Credit</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="transactionTableBody">
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
