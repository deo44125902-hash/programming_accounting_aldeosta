<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive General Journal Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive General Journal Form</h1>

    <div class="container">
        <h2>Journal Transaction</h2>

        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date">
            <span class="error-message" id="dateError"></span>
        </div>

        <div class="form-group">
            <label for="refNo">Reference Number:</label>
            <input type="text" id="refNo" placeholder="Enter reference number">
            <span class="error-message" id="refNoError"></span>
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <input type="text" id="description" placeholder="Enter transaction description">
            <span class="error-message" id="descriptionError"></span>
        </div>

        <div class="form-group">
            <label for="account">Account:</label>
            <select id="account">
                <option value="">-- Select Account --</option>
            </select>
            <span class="error-message" id="accountError"></span>
        </div>

        <div class="form-group">
            <label for="debit">Debit (IDR):</label>
            <input type="number" id="debit" placeholder="0">
            <span class="error-message" id="debitError"></span>
        </div>

        <div class="form-group">
            <label for="credit">Credit (IDR):</label>
            <input type="number" id="credit" placeholder="0">
            <span class="error-message" id="creditError"></span>
        </div>

        <button id="addBtn">Add Transaction Row</button>

        <h2>General Journal</h2>

        <table id="transactionTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Ref No</th>
                    <th>Description</th>
                    <th>Account</th>
                    <th>Debit</th>
                    <th>Credit</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="journalBody">
            </tbody>
        </table>
        <span class="error-message" id="tableError"></span>

        <button id="saveBtn">Save Journal (Dummy)</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
